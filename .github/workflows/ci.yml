name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    env:
      EXLA_TARGET: cpu
      EXLA_BUILD: "false"
      NX_DEFAULT_BACKEND: Nx.BinaryBackend
    strategy:
      matrix:
        elixir: ['1.19', '1.20']
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}
      - name: Install system dependencies (libgit2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev build-essential
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        run: mix test
      - name: Run dsh launcher tests
        run: bash test/dsh_release_test.sh

  linters:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      EXLA_TARGET: cpu
      EXLA_BUILD: "false"
      NX_DEFAULT_BACKEND: Nx.BinaryBackend
    strategy:
      matrix:
        elixir: ['1.20']
        otp: ['29']
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}
      - name: Install system dependencies (libgit2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev build-essential
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Restore PLT cache
        uses: actions/cache@v3
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Install dependencies
        run: mix deps.get
      - name: Run quality checks
        run: mix quality.ci

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [linters, test]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.linters.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Quality gate failed!"
            exit 1
          fi
          echo "✅ Quality gate passed!"
