name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    env:
      EXLA_TARGET: cpu
      EXLA_BUILD: "false"
      NX_DEFAULT_BACKEND: Nx.BinaryBackend
    strategy:
      matrix:
        elixir: ['1.19', '1.20']
        otp: ['29']
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}
      - name: Install system dependencies (libgit2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev build-essential
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        run: mix test --exclude ragex
      - name: Run dsh launcher tests
        run: bash test/dsh_release_test.sh

  linters:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      EXLA_TARGET: cpu
      EXLA_BUILD: "false"
      NX_DEFAULT_BACKEND: Nx.BinaryBackend
    strategy:
      matrix:
        elixir: ['1.20']
        otp: ['29']
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{matrix.elixir}}
          otp-version: ${{matrix.otp}}
      - name: Install system dependencies (libgit2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev build-essential
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Restore PLT cache
        uses: actions/cache@v3
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-
      - name: Install dependencies
        run: mix deps.get
      - name: Run quality checks
        run: mix quality.ci

  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: [test, linters]
    permissions:
      contents: write
    env:
      # Dedicated Mix env: mix.exs deliberately excludes bumblebee/nx/exla/
      # image (Ragex's embeddings/vector-search/image-processing deps) under
      # this env, since their native NIFs cannot load from inside a
      # `mix escript.build` archive. The regular `mix release` build (e.g.
      # via `MIX_ENV=prod`) keeps those deps and keeps embeddings working.
      MIX_ENV: escript
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - name: Install system dependencies (libgit2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev build-essential
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-escript-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-escript-
      - name: Install dependencies
        run: mix deps.get

      - name: Verify tag matches mix.exs version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mix_version="$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])')"
          echo "Tag version:   ${tag_version}"
          echo "mix.exs version: ${mix_version}"
          if [ "${tag_version}" != "${mix_version}" ]; then
            echo "::error::Tag v${tag_version} does not match mix.exs version ${mix_version}. Bump mix.exs before tagging."
            exit 1
          fi

      - name: Build dsh escript
        run: |
          mix escript.build
          mv dsh_escript dsh

      - name: Compute checksum
        run: sha256sum dsh > dsh.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh
            dsh.sha256
          generate_release_notes: true
